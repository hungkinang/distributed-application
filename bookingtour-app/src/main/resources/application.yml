spring:
  application:
    name: bookingtour-app
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bookingtour?createDatabaseIfNotExist=true&characterEncoding=UTF-8&useUnicode=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  sql:
    init:
      mode: always
      data-locations: classpath:db/bookingtour.sql

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-secret}
            scope:
              - email
              - profile

server:
  port: ${SERVER_PORT:8090}

image:
  path: ${IMAGE_PATH:uploads/}

avatar:
  path: ${AVATAR_PATH:uploads/avatar/}

vnp:
  pay-url: ${VNP_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNP_RETURN_URL:http://localhost:8090/payment/vnpay-callback}
  tmn-code: ${VNP_TMN_CODE:}
  hash-secret: ${VNP_HASH_SECRET:}
  api-url: ${VNP_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}

amadeus:
  api:
    key: ${AMADEUS_API_KEY:}
    secret: ${AMADEUS_API_SECRET:}
    base-url: ${AMADEUS_API_BASE_URL:https://test.api.amadeus.com}

news:
  api:
    token: ${NEWS_API_TOKEN:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    url: ${GEMINI_API_URL:}
