server:
  port: 8080
spring:
  application:
    name: svc-news
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/news_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
booking:
  api-base-path: /api/news
news:
  api:
    token: ${NEWS_API_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
