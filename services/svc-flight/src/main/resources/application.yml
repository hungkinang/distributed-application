server:
  port: 8080
spring:
  application:
    name: svc-flight
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/flight_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
booking:
  api-base-path: /api/flights
amadeus:
  api:
    key: ${AMADEUS_API_KEY:}
    secret: ${AMADEUS_API_SECRET:}
    base-url: ${AMADEUS_API_BASE_URL:https://test.api.amadeus.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info
