server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      default-filters:
        - name: CircuitBreaker
          args:
            name: gatewayDefault
            fallbackUri: forward:/fallback
      routes:
        - id: svc-auth
          uri: lb://svc-auth
          predicates:
            - Path=/api/auth/**
        - id: svc-user
          uri: lb://svc-user
          predicates:
            - Path=/api/users/**
        - id: svc-tour
          uri: lb://svc-tour
          predicates:
            - Path=/api/tours/**
        - id: svc-booking
          uri: lb://svc-booking
          predicates:
            - Path=/api/bookings/**
        - id: svc-payment
          uri: lb://svc-payment
          predicates:
            - Path=/api/payments/**
        - id: svc-email
          uri: lb://svc-email
          predicates:
            - Path=/api/email/**
        - id: svc-notification
          uri: lb://svc-notification
          predicates:
            - Path=/api/notifications/**
        - id: svc-contact
          uri: lb://svc-contact
          predicates:
            - Path=/api/contact/**
        - id: svc-review
          uri: lb://svc-review
          predicates:
            - Path=/api/reviews/**
        - id: svc-favorite
          uri: lb://svc-favorite
          predicates:
            - Path=/api/favorites/**
        - id: svc-flight
          uri: lb://svc-flight
          predicates:
            - Path=/api/flights/**
        - id: svc-news
          uri: lb://svc-news
          predicates:
            - Path=/api/news/**

jwt:
  secret: ${JWT_SECRET:dev-jwt-change-in-prod-bookingtour-xx}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka-server:8761/eureka/}

resilience4j:
  circuitbreaker:
    instances:
      gatewayDefault:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
  timelimiter:
    instances:
      gatewayDefault:
        timeout-duration: 10s

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,circuitbreakerevents
