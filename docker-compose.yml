# BookingTour — Distributed Microservices (Java 17, Spring Boot 3)
# Chạy: docker compose up --build -d

name: bookingtour

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - bookingtour-net

x-ms-env: &ms-env
  JWT_SECRET: bookingtour-dev-jwt-hs256-shared-secret-please-change-32chars++
  INTERNAL_SERVICE_TOKEN: bookingtour-internal-service-notify-booking-demo
  EUREKA_URL: http://eureka-server:8761/eureka/
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root

services:
  mysql:
    <<: *service-defaults
    image: mysql:8.0
    container_name: bt-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    <<: *service-defaults
    image: rabbitmq:3.13-management
    container_name: bt-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  eureka-server:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/eureka-server
    container_name: bt-eureka
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8761/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  db-backup:
    <<: *service-defaults
    image: mysql:8.0
    container_name: bt-db-backup
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      BACKUP_DIR: /backups
    volumes:
      - mysql_backup:/backups
      - ./docker/backup/backup-databases.sh:/scripts/backup-databases.sh:ro
    entrypoint: ["/bin/sh", "-c", "chmod +x /scripts/backup-databases.sh && while true; do /scripts/backup-databases.sh; sleep 86400; done"]

  svc-auth:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-auth
    container_name: bt-svc-auth
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-user:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-user
    container_name: bt-svc-user
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-tour:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-tour
    container_name: bt-svc-tour
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tour_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-booking:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-booking
    container_name: bt-svc-booking
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/booking_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      TOUR_SERVICE_BASE_URL: http://svc-tour:8080
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      svc-tour:
        condition: service_started
      eureka-server:
        condition: service_healthy

  svc-payment:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-payment
    container_name: bt-svc-payment
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      BOOKING_SERVICE_BASE_URL: http://svc-booking:8080
      VNP_RETURN_URL: http://localhost:8088/api/payments/vnpay/callback
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-email:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-email
    container_name: bt-svc-email
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/email_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      EMAIL_MOCK_SEND: "true"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-notification:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-notification
    container_name: bt-svc-notification
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-contact:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-contact
    container_name: bt-svc-contact
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/contact_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-review:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-review
    container_name: bt-svc-review
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/review_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-favorite:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-favorite
    container_name: bt-svc-favorite
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/favorite_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-flight:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-flight
    container_name: bt-svc-flight
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/flight_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      AMADEUS_API_KEY: "${AMADEUS_API_KEY:-}"
      AMADEUS_API_SECRET: "${AMADEUS_API_SECRET:-}"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  svc-news:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/svc-news
    container_name: bt-svc-news
    environment:
      <<: *ms-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/news_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
      NEWS_API_TOKEN: "${NEWS_API_TOKEN:-}"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        MODULE_PATH: services/api-gateway
    container_name: bt-api-gateway
    ports:
      - "8088:8080"
    environment:
      <<: *ms-env
    depends_on:
      eureka-server:
        condition: service_healthy
      svc-auth:
        condition: service_started
      svc-booking:
        condition: service_started

networks:
  bookingtour-net:
    driver: bridge

volumes:
  mysql_data:
  mysql_backup:
